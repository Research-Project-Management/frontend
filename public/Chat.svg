<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="125" cy="125" r="125" fill="#FFFFFF"/>
  <circle cx="125" cy="125" r="125" fill="url(#gradient-base)"/>
  <circle cx="170" cy="80" r="95" fill="url(#gradient-blue)" opacity="0.9"/>
  <circle cx="75" cy="170" r="90" fill="url(#gradient-orange)" opacity="0.95"/>
  <circle cx="140" cy="180" r="80" fill="url(#gradient-warm)" opacity="0.85"/>
  <defs>
    <radialGradient id="gradient-base" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(125 125) rotate(90) scale(125)">
      <stop stop-color="#3370FF"/>
      <stop offset="1" stop-color="#F97802"/>
    </radialGradient>
    <radialGradient id="gradient-blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 80) rotate(90) scale(95)">
      <stop stop-color="#3370FF"/>
      <stop offset="1" stop-color="#3370FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradient-orange" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(75 170) rotate(90) scale(90)">
      <stop stop-color="#FFCB2C"/>
      <stop offset="0.6" stop-color="#F97802"/>
      <stop offset="1" stop-color="#F97802" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gradient-warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 180) rotate(90) scale(80)">
      <stop stop-color="#F97802"/>
      <stop offset="1" stop-color="#F97802" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
