name: Frontend CI Quality Gates

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality Gates, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run verify:oxlint

      - name: Run ESLint (DESIGN.md & layer boundaries)
        run: pnpm run lint

      - name: Run AST Quality Gates
        run: pnpm run verify:gates

      - name: Run Architecture Gate (dependency-cruiser)
        run: pnpm run verify:arch

      - name: Run Duplication Gate (jscpd)
        run: pnpm run verify:dup

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests with Coverage
        run: pnpm run test -- --coverage

      - name: Enforce New-Code Coverage (>= 80% on PR diff)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          pnpm exec tsx scripts/gates/verify-diff-coverage.ts --base="origin/${{ github.base_ref }}" --min=80

      - name: Verify Production Build
        run: pnpm run build
